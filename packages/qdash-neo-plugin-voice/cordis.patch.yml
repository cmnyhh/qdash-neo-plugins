# 语音插件。形态见本仓库的 docs/plugin-development.md §1.2：
# 由 `package.json` 的 `dsh.bundle.patch` 指向，装进 profile 后由 DSH 展开。
#
# 注意 `insert:` 是必需的 —— 直接写 `- id: xxx` 是"按 id 修改已有条目"，
# id 不存在时会被静默忽略（这个坑踩过一次，表现是"装了但没反应"）。
- insert:
    - id: qq-voice
      name: 'qdash-neo-plugin-voice'
      config:
        # ⚠️ 这里的 `tts:` 只是**初始默认值**。
        #
        # 装好之后在控制台「语音库」选项卡里改，保存即生效、**不用重启宿主**，
        # 而且那份配置优先于这里。这整段留在文件里只为了一件事：
        # 重装或换机器时，一份就能抄回去，不用重新点一遍。
        #
        # 想恢复默认：在控制台把值改回去，或清掉 kv 里 `cfg:qdash-neo-plugin-voice:tts`。
        tts:
          # 默认关。配好 endpoint 再改成 true（也可以装完之后在控制台打开）。
          enabled: false

          # ── 三种协议选一种 ──────────────────────────────────────────
          #
          # 1) openai —— /v1/audio/speech 兼容（最常见，推荐）
          #    protocol: 'openai'
          #    endpoint: 'http://127.0.0.1:9880/v1/audio/speech'
          #    apiKey: ''
          #    model: 'tts-1'
          #    voice: 'alloy'
          #
          # 2) gpt-sovits —— 原生 /tts 接口
          #    protocol: 'gpt-sovits'
          #    endpoint: 'http://127.0.0.1:9880/tts'
          #    refAudioPath: '/opt/ref/voice.wav'   # 服务器上的绝对路径，必须真实存在
          #    promptText: '参考音频里说的那句话'      # 要与音频内容一致，否则音色会飘
          #    promptLang: 'zh'
          #    textLang: 'zh'
          #    speedFactor: 1
          #
          # 3) custom —— 形状奇怪的端点，自己填 body 模板
          #    protocol: 'custom'
          #    endpoint: 'http://127.0.0.1:8080/say'
          #    bodyTemplate: '{"q":"{{text}}","spk":"a"}'
          #
          # ───────────────────────────────────────────────────────────

          protocol: 'openai'
          endpoint: ''

          # 超时与限额
          timeoutMs: 30000
          maxChars: 200          # 单次合成最多多少字（合成慢、按量计费）
          format: 'mp3'
          cacheMaxFiles: 200     # 合成缓存上限，超出按最旧的删
